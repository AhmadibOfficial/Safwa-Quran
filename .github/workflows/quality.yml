name: Safwa Quality
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  religious-content-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/quran_pipeline.py check
      - name: Compare pinned Quran sources without editing them
        run: |
          python3 scripts/compare_uthmani_editions.py \
            --primary sources/review_only/tanzil_uthmani_1.1_verbatim.txt \
            --secondary sources/review_only/secondary_tanzil_uthmani_verbatim.txt \
            --catalog assets/data/chapters.tsv \
            --report .staging/corpus_comparison.json
      - name: Release must remain blocked
        run: |
          if python3 scripts/quran_pipeline.py release; then
            echo 'ERROR: unreviewed Quran must not be released'
            exit 1
          fi
  flutter-application:
    # Source-only until explicit platform-build and release authorization.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
