name: safwa_quran
description: Safwa Institute offline-first Quran application
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  cryptography: ^2.9.0
  adhan_dart: ^2.0.1
  timezone: ^0.11.2
  # Pinned to Dart 3.10-compatible releases until the Flutter SDK is upgraded.
  sqflite: '>=2.4.2+1 <2.4.3'
  sqflite_common: '>=2.5.8 <2.5.9'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Desktop/unit-test factory, not wired into mobile production initialization.
  sqflite_common_ffi: '>=2.4.0+3 <2.4.1'
flutter:
  uses-material-design: true
  assets:
    - assets/data/
